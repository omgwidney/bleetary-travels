# Firebase App Hosting config for the bleetary-web backend.
# Public Firebase web config only — secrets go in Cloud Secret Manager via
# `firebase apphosting:secrets:set` and are referenced with `secret:` below.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
  - variable: NEXT_PUBLIC_APP_URL
    value: https://bleetary-web--bleetary-travels1.us-central1.hosted.app
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBj6KXHZvkSbbTnqQQzmx4elLZ1b5xeQGM
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: bleetary-travels1.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: bleetary-travels1
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: bleetary-travels1.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "392683814337"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:392683814337:web:a731cc700e3db1b5928340
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-MLNM40TNN9
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: bleetary-travels1
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_STORAGE_BUCKET
    value: bleetary-travels1.firebasestorage.app
    availability:
      - RUNTIME

  # Uncomment after creating each secret with `firebase apphosting:secrets:set <name>`:
  # - variable: STRIPE_SECRET_KEY
  #   secret: stripe-secret-key
  # - variable: STRIPE_WEBHOOK_SECRET
  #   secret: stripe-webhook-secret
  # - variable: RESEND_API_KEY
  #   secret: resend-api-key
