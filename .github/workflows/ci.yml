name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:test"
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-TEST
  NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"
  FIREBASE_ADMIN_PROJECT_ID: test-project

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run check
      - run: npm run audit:production
      - run: npm run test:rules
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:auth-e2e

  # Firebase App Hosting deploys from the `production` branch. Advance it to
  # the tested commit only after every check above has passed on main.
  promote:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: promote-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production
        run: |
          git fetch origin production
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "production already includes $GITHUB_SHA (a newer run promoted it); nothing to do."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/production"
